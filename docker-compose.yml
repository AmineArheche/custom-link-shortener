services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auralink-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - BASE_URL=http://localhost:8000
      - DATABASE_URL=sqlite:////data/link_shortener.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost
    volumes:
      - auralink_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auralink-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  auralink_data:
